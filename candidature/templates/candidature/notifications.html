<!DOCTYPE html>
<html>
<head>
    <title>Mes notifications</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; }
        .notification { padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid; }
        .info { background: #e3f2fd; border-left-color: #2196f3; }
        .success { background: #e8f5e9; border-left-color: #4caf50; }
        .error { background: #ffebee; border-left-color: #f44336; }
        .date { font-size: 12px; color: #999; margin-top: 5px; }
        a { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔔 Mes notifications</h2>
        
        {% if notifications %}
            {% for notif in notifications %}
                <div class="notification {{ notif.type }}">
                    <p>{{ notif.contenu }}</p>
                    <div class="date">{{ notif.dateEnvoi|date:"d/m/Y H:i" }}</div>
                </div>
            {% endfor %}
        {% else %}
            <p>Aucune notification.</p>
        {% endif %}
        
        <a href="/dashboard/">⬅ Retour</a>
    </div>
</body>
</html>
