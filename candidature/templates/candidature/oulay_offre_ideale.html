<!DOCTYPE html>
<html>
<head>
    <title>OULAY - Offre idéale</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; }
        button { margin-top: 20px; background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🧠 OULAY – Trouve ton offre idéale</h2>
        <p>Réponds à ces 3 questions, OULAY te recommande la meilleure offre.</p>
        <form method="post">
            {% csrf_token %}
            <label>1. Quel type de poste recherches-tu ?</label>
            <input type="text" name="poste" placeholder="Ex: Développeur, Data Analyst, Commercial..." required>

            <label>2. Dans quelle ville ?</label>
            <input type="text" name="ville" placeholder="Ex: Paris, Rabat, Casablanca..." required>

            <label>3. Quel type de contrat ?</label>
            <select name="contrat" required>
                <option value="">-- Choisis --</option>
                <option value="CDI">CDI</option>
                <option value="CDD">CDD</option>
                <option value="Stage">Stage</option>
                <option value="Alternance">Alternance</option>
            </select>

            <button type="submit">🎯 Trouver mon offre idéale</button>
        </form>
        <br>
        <a href="/dashboard/">⬅ Retour</a>
    </div>
</body>
</html>
