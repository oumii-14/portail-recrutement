{% extends 'candidature/base.html' %}
{% block title %}Créer une offre – OBMI Recrutement{% endblock %}
{% block extra_head %}
<style>
.container-narrow { max-width: 700px; margin: 0 auto; padding: 32px 24px; }
.form-card { background: var(--surface); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; }
.form-header { background: linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%); padding: 24px 28px; color: white; }
.form-header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.form-header p { font-size: 14px; opacity: 0.9; margin-top: 4px; }
.form-body { padding: 28px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-actions { display: flex; gap: 16px; margin-top: 28px; }
.btn-submit { background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 40px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
.btn-submit:hover { background: var(--navy); transform: translateY(-1px); }
.btn-cancel { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); padding: 12px 28px; border-radius: 40px; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
.btn-cancel:hover { background: #FEE2E2; color: #DC2626; }
@media (max-width: 768px) {
    .form-row { grid-template-columns: 1fr; }
    .form-body { padding: 20px; }
    .form-actions { flex-direction: column; }
    .btn-submit, .btn-cancel { justify-content: center; }
}
</style>
{% endblock %}
{% block content %}
<div class="page-content">
    <div class="container-narrow">
        <div class="form-card">
            <div class="form-header">
                <h1><i class="fas fa-briefcase"></i> Créer une offre</h1>
                <p>Publiez une nouvelle annonce</p>
            </div>
            <div class="form-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="form-group">
                            <label>Titre du poste</label>
                            <input type="text" name="titre" placeholder="ex: Développeur React" required>
                        </div>
                        <div class="form-group">
                            <label>Type de contrat</label>
                            <select name="type_contrat" required>
                                <option value="CDI">CDI</option>
                                <option value="CDD">CDD</option>
                                <option value="Stage">Stage</option>
                                <option value="Alternance">Alternance</option>
                                <option value="Freelance">Freelance</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Lieu</label>
                            <input type="text" name="lieu" placeholder="ex: Paris" required>
                        </div>
                        <div class="form-group">
                            <label>Date d'expiration</label>
                            <input type="date" name="date_expiration" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" rows="8" placeholder="Décrivez le poste, les missions, le profil recherché..." required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit"><i class="fas fa-check"></i> Publier l'offre</button>
                        <a href="{% url 'mes_offres' %}" class="btn-cancel"><i class="fas fa-times"></i> Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
