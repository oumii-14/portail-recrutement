<!DOCTYPE html>
<html>
<head>
    <title>OULAY - Offre générée</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; }
        .offre { background: #eef2ff; padding: 20px; border-radius: 12px; margin-top: 20px; }
        textarea { width: 100%; height: 150px; padding: 10px; margin-top: 10px; font-family: monospace; }
        .btn { display: inline-block; margin-top: 20px; background: #2563eb; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; }
        .btn-creer { background: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✍️ OULAY – Ton offre est prête</h2>
        
        <div class="offre">
            <h3>📢 {{ titre }}</h3>
            <p><strong>Lieu :</strong> {{ lieu }}</p>
            <p><strong>Description :</strong></p>
            <textarea readonly>{{ description }}</textarea>
            <p style="margin-top: 10px;">👉 Copie ce texte et colle‑le dans le formulaire de création d’offre.</p>
        </div>
        
        <a href="/creer-offre/" class="btn btn-creer">📝 Créer mon offre maintenant</a>
        <br>
        <a href="/oulay-aide-offre/" class="btn" style="background:#6c757d;">⬅ Générer une autre offre</a>
        <br>
        <a href="/dashboard/" class="btn-back" style="display: inline-block; margin-top: 15px; color: #2563eb; text-decoration: none;">⬅ Retour au dashboard</a>
    </div>
</body>
</html>
