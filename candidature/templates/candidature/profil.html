<!DOCTYPE html>
<html>
<head>
    <title>Mon profil</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; }
        .info { margin: 20px 0; }
        .info p { padding: 10px; border-bottom: 1px solid #eee; }
        .label { font-weight: bold; width: 150px; display: inline-block; }
        .btn { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👤 Mon profil</h2>
        
        <div class="info">
            <p><span class="label">Nom :</span> {{ user.nom }}</p>
            <p><span class="label">Prénom :</span> {{ user.prenom }}</p>
            <p><span class="label">Email :</span> {{ user.email }}</p>
            <p><span class="label">Rôle :</span> {{ user.role }}</p>
            <p><span class="label">Membre depuis :</span> {{ user.dateCreation|date:"d/m/Y" }}</p>
            <p><span class="label">Statut :</span> {{ user.statut }}</p>
        </div>
        
        <a href="/dashboard/" class="btn">⬅ Retour au dashboard</a>
    </div>
</body>
</html>
