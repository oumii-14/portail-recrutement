<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration – OBMI Recrutement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F5F5F7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-login-container {
            max-width: 450px;
            width: 100%;
        }

        .admin-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            border: 1px solid #EAEAEA;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            background: #1E3A5F;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .admin-icon i {
            font-size: 32px;
            color: white;
        }

        .admin-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 8px;
        }

        .admin-header p {
            font-size: 14px;
            color: #666666;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #333333;
        }

        label i {
            margin-right: 8px;
            color: #1E3A5F;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #EAEAEA;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #1E3A5F;
            box-shadow: 0 0 0 3px rgba(30,58,95,0.1);
        }

        .btn-login {
            background: #1E3A5F;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #0A2540;
            transform: translateY(-1px);
        }

        .error-message {
            background: #FEF2F2;
            border: 1px solid #FEE2E2;
            color: #991B1B;
            padding: 14px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .admin-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #EAEAEA;
        }

        .admin-footer a {
            color: #1E3A5F;
            text-decoration: none;
            font-size: 13px;
        }

        .admin-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #1E3A5F;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
            transition: 0.2s;
        }

        .back-link:hover {
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-card">
            <div class="admin-header">
                <div class="admin-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>Espace Administration</h1>
                <p>Accès réservé aux administrateurs</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            {% if error %}
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <form method="post" action="/admin-login/">
                {% csrf_token %}
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email administrateur</label>
                    <input type="email" name="email" placeholder="admin@obmi.com" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Mot de passe</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Accéder à l'administration
                </button>
            </form>

            <div class="admin-footer">
                <a href="/">⬅ Retour à l'accueil</a>
            </div>
        </div>
    </div>
</body>
</html>
