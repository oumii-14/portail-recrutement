<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau message – OBMI Recrutement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F5F5F7;
            color: #1A1A1A;
        }

        /* HEADER */
        .header {
            background: #FFFFFF;
            border-bottom: 1px solid #EAEAEA;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
        }

        .logo .blue {
            background: linear-gradient(135deg, #0A2540, #1E3A5F);
            -webkit-background-clip: text;
            background-clip: text;
            color: #1E3A5F;
        }

        .logo .light {
            color: #5F6F82;
            font-weight: 500;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #4A4A4A;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #1E3A5F;
        }

        .nav-links .btn-logout {
            background: #FEF2F2;
            border: 1px solid #FEE2E2;
            padding: 8px 20px;
            border-radius: 40px;
            color: #DC2626;
        }

        .nav-links .btn-logout:hover {
            background: #FEE2E2;
            color: #991B1B;
        }

        /* CONTAINER */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 40px;
        }

        /* FORM CARD */
        .form-card {
            background: #FFFFFF;
            border-radius: 24px;
            border: 1px solid #EAEAEA;
            overflow: hidden;
        }

        .form-header {
            padding: 24px;
            background: #FAFAFA;
            border-bottom: 1px solid #EAEAEA;
        }

        .form-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-header h1 i {
            color: #1E3A5F;
        }

        .form-header p {
            color: #666666;
            font-size: 14px;
            margin-top: 6px;
        }

        /* FORM BODY */
        .form-body {
            padding: 28px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            color: #333333;
        }

        label i {
            margin-right: 8px;
            color: #1E3A5F;
            width: 20px;
        }

        select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #EAEAEA;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
            background: #FFFFFF;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #1E3A5F;
            box-shadow: 0 0 0 3px rgba(30,58,95,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .help-text {
            font-size: 12px;
            color: #888888;
            margin-top: 6px;
        }

        /* BUTTONS */
        .form-actions {
            display: flex;
            gap: 16px;
            margin-top: 28px;
        }

        .btn-send {
            background: #1E3A5F;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-send:hover {
            background: #0A2540;
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: #F5F5F5;
            color: #666666;
            border: 1px solid #EAEAEA;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-cancel:hover {
            background: #FEE2E2;
            color: #DC2626;
            border-color: #FECACA;
        }

        /* BACK LINK */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #1E3A5F;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            margin-top: 24px;
        }

        .back-link:hover {
            gap: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
                flex-direction: column;
                align-items: flex-start;
            }
            .container {
                padding: 24px 20px;
            }
            .form-body {
                padding: 20px;
            }
            .form-actions {
                flex-direction: column;
            }
            .btn-send, .btn-cancel {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <span class="blue">OBMI</span><span class="light">Recrutement</span>
        </div>
        <div class="nav-links">
            <a href="/">Accueil</a>
            <a href="/dashboard/">Dashboard</a>
            <a href="/deconnexion/" class="btn-logout">🚪 Déconnexion</a>
        </div>
    </div>

    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>
                    <i class="fas fa-paper-plane"></i>
                    Nouveau message
                </h1>
              
            </div>

            <div class="form-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Destinataire</label>
                        <select name="destinataire" required>
                            <option value="">-- Choisir un destinataire --</option>
                            {% for u in utilisateurs %}
                                <option value="{{ u.id }}">
                                    {{ u.prenom }} {{ u.nom }} 
                                    {% if u.role == 'candidat' %}
                                        (Candidat)
                                    {% elif u.role == 'recruteur' %}
                                        (Recruteur)
                                    {% else %}
                                        ({{ u.role }})
                                    {% endif %}
                                </option>
                            {% endfor %}
                        </select>
                        <div class="help-text">Sélectionnez la personne à qui vous souhaitez envoyer un message</div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-comment"></i> Message</label>
                        <textarea name="contenu" rows="5" placeholder="Bonjour, je souhaite vous contacter concernant..." required></textarea>
                        <div class="help-text">Soyez clair et précis dans votre message</div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-send">
                            <i class="fas fa-paper-plane"></i> Envoyer le message
                        </button>
                        <a href="{% url 'messages_liste' %}" class="btn-cancel">
                            <i class="fas fa-times"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- BACK LINK -->
        <a href="{% url 'messages_liste' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Retour aux messages
        </a>
    </div>

</body>
</html>
