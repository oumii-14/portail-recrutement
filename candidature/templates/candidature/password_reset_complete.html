{% extends 'candidature/base.html' %}
{% block title %}Mot de passe modifié – OBMI Recrutement{% endblock %}
{% block extra_head %}
<style>
.auth-page { min-height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: linear-gradient(135deg, #F0F4FF 0%, var(--bg) 70%); }
.auth-card { background: var(--surface); border-radius: 32px; padding: 48px; width: 100%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); border: 1px solid var(--border); text-align: center; }
.auth-card h2 { color: var(--navy); font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
.auth-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
.auth-card .icon { font-size: 48px; color: #16A34A; margin-bottom: 16px; }
.auth-card a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--primary); color: white; border-radius: 40px; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; }
.auth-card a:hover { background: var(--navy); }
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="icon"><i class="fas fa-check-circle"></i></div>
        <h2>Mot de passe modifié !</h2>
        <p>Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
        <a href="/login/">Se connecter</a>
    </div>
</div>
{% endblock %}
