<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès refusé – OBMI Recrutement</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231E3A5F'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='16' fill='white'%3EO%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F5F7; color: #1A1A1A; }
        .card { text-align: center; max-width: 480px; padding: 60px 40px; }
        .code { font-size: 120px; font-weight: 800; background: linear-gradient(135deg, #DC2626, #991B1B); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; }
        h1 { font-size: 24px; margin: 16px 0 8px; color: #111; }
        p { color: #666; font-size: 15px; margin-bottom: 32px; line-height: 1.6; }
        .btn { display: inline-flex; align-items: center; gap: 10px; background: #1E3A5F; color: white; padding: 14px 32px; border-radius: 40px; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .btn:hover { background: #0A2540; transform: translateY(-2px); }
        .icon { font-size: 64px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚫</div>
        <div class="code">403</div>
        <h1>Accès refusé</h1>
        <p>Vous n'avez pas les permissions nécessaires pour accéder à cette page.</p>
        <a href="/" class="btn"><span>←</span> Retour à l'accueil</a>
    </div>
</body>
</html>
